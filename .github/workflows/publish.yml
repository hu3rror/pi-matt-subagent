# npm publish workflow — Trusted Publisher / OIDC, zero token.
# Mode A (staged): `npm stage publish`; the maintainer approves locally with 2FA.
# First release used `npm publish` because `npm stage` requires the package to
# already exist in the registry — the package now exists, so stage applies again.
# Prereq: package exists on npmjs with this repo + workflow filename bound as
# trusted publisher.

name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # Trusted Publishing (OIDC); also generates provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # npm 11+ for `npm stage` (Node 24 ships it)
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v${tag} does not match package.json version ${version}"
            exit 1
          fi

      # Mode A: staged — publish only after the maintainer approves the
      # stage-id locally with 2FA (npm stage approve <stage-id>).
      - name: Stage package on npm registry
        run: npm stage publish --provenance

      # Mode B (direct publish; used for the first release only, because stage
      # requires the package to already exist on npm):
      # - name: Publish to npm registry
      #   run: npm publish --provenance
