# npm publish workflow — Trusted Publisher / OIDC, zero token, direct flow.
# A `v*` tag push publishes immediately via OIDC `npm publish`; no human gate.
# First release exception: a package not on the registry yet cannot use OIDC
# (the trusted publisher binding requires an existing package) — the first
# publish is a local `npm publish` by the maintainer.
# Prereq: package exists on npmjs with this repo + workflow filename bound as
# trusted publisher, with Allowed actions permitting `npm publish`.

name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # Trusted Publishing (OIDC); also generates provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # Node 24 LTS (npm publish has no npm 11 gate)
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v${tag} does not match package.json version ${version}"
            exit 1
          fi

      # Direct flow: OIDC authenticates automatically and generates provenance
      # (trusted publishing needs no --provenance flag; passing it explicitly
      # is harmless and matches the official example).
      - name: Publish to npm registry
        run: npm publish --provenance
