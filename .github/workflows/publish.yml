# npm publish workflow — Trusted Publisher / OIDC, zero token.
# First release: package does not exist on npm yet, and `npm stage` requires the
# package to already be in the registry — so this publishes directly (Mode B).
# Once the package exists, switch the last step back to `npm stage publish`
# (Mode A: maintainer approves locally with 2FA).
# Prereq: package exists on npmjs with this repo + workflow filename bound as
# trusted publisher (first OIDC publish of a new package creates it and binds
# the workflow automatically).

name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # Trusted Publishing (OIDC); also generates provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # npm 11+ for `npm stage` (Node 24 ships it)
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install # no package-lock.json in this repo

      - name: Run tests
        run: npm test

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v${tag} does not match package.json version ${version}"
            exit 1
          fi

      # Mode B (first release): direct publish — npm creates the package and
      # binds this workflow as its trusted publisher via OIDC.
      - name: Publish to npm registry
        run: npm publish --provenance

      # Mode A (later releases, maintainer-gated):
      # - name: Stage package on npm registry
      #   run: npm stage publish --provenance
